<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#493722">
  <title>HistoryRunnn | Welcome</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #fff8e9;
      font-family: Georgia, "Times New Roman", serif;
    }

    .background {
      position: fixed;
      z-index: -1;
      inset: 0;
    }

    .background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .background::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgb(36 27 17 / 62%), rgb(36 27 17 / 12%));
      content: "";
    }

    main {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: end center;
      padding: 24px 24px clamp(48px, 10vh, 100px);
    }

    .welcome {
      width: min(100%, 540px);
      padding: clamp(28px, 7vw, 56px);
      text-align: center;
      background: rgb(48 36 23 / 68%);
      border-radius: 12px;
      box-shadow: 0 18px 60px rgb(25 18 10 / 35%);
    }

    .start-button {
      display: block;
      width: 100%;
      margin-bottom: 22px;
      padding: 15px 20px;
      color: #fff3d4;
      background: linear-gradient(180deg, #805a2e, #55391d);
      border: 1px solid #cba66a;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgb(22 16 8 / 30%);
      font: 600 1.05rem Georgia, "Times New Roman", serif;
      text-decoration: none;
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .start-button:hover {
      background: linear-gradient(180deg, #936a39, #674722);
      box-shadow: 0 8px 20px rgb(22 16 8 / 40%);
    }

    .start-button:focus-visible {
      outline: 2px solid #f0cd88;
      outline-offset: 3px;
    }

    .quest-transition {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .quest-board {
      position: relative;
      isolation: isolate;
      display: grid;
      width: min(100%, 900px);
      height: min(82vh, 720px);
      height: min(82svh, 720px);
      place-items: center;
      align-content: center;
      gap: clamp(14px, 2.4vh, 22px);
      padding: clamp(28px, 8vw, 72px);
      color: #493722;
      text-align: center;
      background:
        radial-gradient(ellipse at 12% 18%, rgb(128 86 43 / 12%), transparent 26%),
        radial-gradient(ellipse at 88% 82%, rgb(128 86 43 / 10%), transparent 24%),
        repeating-linear-gradient(1deg, rgb(121 82 40 / 4%) 0 1px, transparent 1px 6px),
        linear-gradient(135deg, #f7e8c7, #dbbd85);
      border: clamp(8px, 1.5vw, 16px) ridge #805b32;
      border-radius: 12px;
      box-shadow: 0 28px 80px rgb(22 16 8 / 56%), inset 0 0 0 3px rgb(255 246 221 / 65%), inset 0 0 38px rgb(95 61 24 / 14%);
      transform: translateY(-120%) rotate(-1.5deg);
    }

    .quest-board::before {
      position: absolute;
      z-index: 1;
      inset: clamp(15px, 2.4vw, 28px);
      border: 2px solid rgb(122 83 40 / 46%);
      border-radius: 4px;
      box-shadow: inset 0 0 0 2px rgb(255 248 230 / 35%);
      content: "";
      pointer-events: none;
    }

    .quest-board::after {
      position: absolute;
      z-index: 1;
      inset: clamp(15px, 2.4vw, 28px);
      background:
        radial-gradient(circle at 0 0, #9b713f 0 3px, #f4dfb6 4px 5px, transparent 6px),
        radial-gradient(circle at 100% 0, #9b713f 0 3px, #f4dfb6 4px 5px, transparent 6px),
        radial-gradient(circle at 0 100%, #9b713f 0 3px, #f4dfb6 4px 5px, transparent 6px),
        radial-gradient(circle at 100% 100%, #9b713f 0 3px, #f4dfb6 4px 5px, transparent 6px);
      content: "";
      pointer-events: none;
    }

    .quest-notes {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      gap: clamp(14px, 2.5vw, 24px);
      width: 100%;
    }

    .quest-heading {
      position: relative;
      z-index: 2;
      width: min(100%, 520px);
      margin: 0;
      padding: 0 12px 10px;
      color: #5f4225;
      border-bottom: 1px solid rgb(122 83 40 / 42%);
      font-size: clamp(1.6rem, 3.4vw, 2.35rem);
      font-variant: small-caps;
      letter-spacing: 0.12em;
      text-shadow: 0 1px 0 rgb(255 248 230 / 70%);
    }

    .quest-note {
      position: relative;
      display: grid;
      min-height: clamp(170px, 22vw, 230px);
      align-content: center;
      justify-items: center;
      gap: 12px;
      padding: 34px 14px 20px;
      color: #493722;
      background:
        radial-gradient(ellipse at 18% 20%, rgb(255 255 255 / 35%), transparent 48%),
        repeating-linear-gradient(2deg, rgb(121 82 40 / 5%) 0 1px, transparent 1px 5px),
        linear-gradient(135deg, #f8e9c7, #d8b77c);
      clip-path: polygon(3% 2%, 18% 3%, 35% 1%, 52% 3%, 70% 1%, 97% 2%, 99% 18%, 97% 35%, 100% 52%, 98% 70%, 100% 96%, 79% 98%, 61% 96%, 43% 100%, 24% 97%, 3% 99%, 1% 80%, 3% 62%, 0 43%, 2% 25%);
      filter: drop-shadow(3px 8px 4px rgb(34 23 12 / 42%));
      text-align: center;
      text-decoration: none;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .quest-note:nth-child(1) {
      transform: rotate(-2deg);
    }

    .quest-note:nth-child(2) {
      transform: rotate(1.5deg);
    }

    .quest-note:nth-child(3) {
      transform: rotate(-1deg);
    }

    .quest-note::before {
      position: absolute;
      top: 10px;
      left: 50%;
      width: 16px;
      height: 16px;
      background: radial-gradient(circle at 34% 28%, #ffe5aa 0 1px, #a84231 2px 6px, #68291f 7px);
      border-radius: 50%;
      box-shadow: 0 2px 4px rgb(38 23 12 / 55%);
      content: "";
      transform: translateX(-50%);
    }

    .quest-note:hover {
      filter: drop-shadow(4px 12px 6px rgb(34 23 12 / 48%));
      transform: translateY(-5px) rotate(0) scale(1.025);
    }

    .quest-note:focus-visible {
      outline: 3px solid #6e4726;
      outline-offset: 7px;
    }

    .quest-note-name {
      font-size: clamp(1.15rem, 2.2vw, 1.65rem);
      font-weight: 700;
    }

    .quest-note-action {
      color: #76552f;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .quest-note-stamp {
      position: absolute;
      bottom: 12px;
      left: 50%;
      z-index: 1;
      padding: 4px 7px;
      color: #9c302a;
      background: rgb(248 233 199 / 76%);
      border: 2px double currentColor;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      text-transform: uppercase;
      transform: translateX(-50%) rotate(-12deg) scale(0.7);
      transition: opacity 180ms ease, transform 180ms ease;
      visibility: hidden;
    }

    .quest-note.is-finished .quest-note-stamp {
      opacity: 0.94;
      transform: translateX(-50%) rotate(-12deg) scale(1);
      visibility: visible;
    }

    .quest-note.is-finished .quest-note-action {
      visibility: hidden;
    }

    .reward-panel {
      display: grid;
      justify-items: center;
      gap: 7px;
    }

    .reward-button {
      min-width: 150px;
      padding: 11px 24px;
      color: #fff3d4;
      background: linear-gradient(180deg, #805a2e, #55391d);
      border: 1px solid #cba66a;
      border-radius: 5px;
      box-shadow: 0 4px 12px rgb(22 16 8 / 28%);
      font: 700 1rem Georgia, "Times New Roman", serif;
      letter-spacing: 0.05em;
      opacity: 0.55;
      cursor: not-allowed;
    }

    .reward-button:enabled {
      opacity: 1;
      cursor: pointer;
    }

    .reward-button:focus-visible {
      outline: 2px solid #805b32;
      outline-offset: 4px;
    }

    .reward-status {
      margin: 0;
      color: #654a2a;
      font-size: 0.85rem;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .quest-board {
        height: auto;
        min-height: min(82svh, 720px);
      }

      .quest-notes {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .quest-note {
        min-height: 100px;
        padding: 28px 14px 14px;
        gap: 6px;
      }

      .quest-note-name {
        font-size: 1.2rem;
      }

      .quest-note-action {
        font-size: 0.75rem;
      }
    }

    @keyframes quest-board-drop {
      0% {
        transform: translateY(-125%) rotate(-2.2deg) scale(1);
      }

      48% {
        transform: translateY(7%) rotate(1.6deg) scale(1.03, 0.92);
      }

      58% {
        transform: translateY(-12%) rotate(-1.1deg) scale(0.99, 1.05);
      }

      69% {
        transform: translateY(3%) rotate(0.7deg) scale(1.02, 0.96);
      }

      78% {
        transform: translateY(-5%) rotate(-0.4deg) scale(0.995, 1.03);
      }

      87% {
        transform: translateY(1.5%) rotate(0.2deg) scale(1.01, 0.98);
      }

      94% {
        transform: translateY(-0.6%) rotate(-0.1deg) scale(0.999, 1.01);
      }

      100% {
        transform: translateY(0) rotate(0) scale(1);
      }
    }

    body.is-transitioning .quest-transition {
      opacity: 1;
      visibility: visible;
    }

    body.is-transitioning .quest-board {
      animation: quest-board-drop 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    input {
      width: 100%;
      padding: 19px 24px;
      color: #493722;
      background:
        radial-gradient(ellipse at 18% 20%, rgb(255 255 255 / 35%), transparent 50%),
        linear-gradient(180deg, #fff4d8, #e3c88e);
      border: none;
      border-radius: 6px;
      font: 1.1rem Georgia, "Times New Roman", serif;
    }

    input::placeholder {
      color: #735a36;
      opacity: 1;
      font-weight: 600;
    }

    input:focus-visible {
      outline: 2px solid #a4773f;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .quest-transition {
        transition-duration: 1ms;
      }
    }
  </style>
</head>
<body>
  <div class="background">
    <img src="entrance backround.jpg" alt="">
  </div>
  <main>
    <section class="welcome">
      <a class="start-button" href="lobby.html">Start your Quest</a>
      <input id="player-name" name="name" type="text" placeholder="Your name" autocomplete="name" aria-label="Your name">
    </section>
  </main>
  <div class="quest-transition" aria-hidden="true">
    <div class="quest-board">
      <h1 class="quest-heading">Quest Board</h1>
      <nav class="quest-notes" aria-label="Choose a country quest">
        <a class="quest-note" data-quest="japan" href="japan.html">
          <span class="quest-note-name">Japan Quest</span>
          <span class="quest-note-action">Open quest</span>
          <span class="quest-note-stamp" aria-hidden="true">Finished!</span>
        </a>
        <a class="quest-note" data-quest="america" href="america.html">
          <span class="quest-note-name">America Quest</span>
          <span class="quest-note-action">Open quest</span>
          <span class="quest-note-stamp" aria-hidden="true">Finished!</span>
        </a>
        <a class="quest-note" data-quest="spanish" href="spanish.html">
          <span class="quest-note-name">Spanish Quest</span>
          <span class="quest-note-action">Open quest</span>
          <span class="quest-note-stamp" aria-hidden="true">Finished!</span>
        </a>
      </nav>
      <div class="reward-panel">
        <button class="reward-button" type="button" disabled>Reward</button>
        <p class="reward-status" aria-live="polite">Finish all three quests to unlock the reward.</p>
      </div>
    </div>
  </div>
  <script>
    const questIds = ["japan", "america", "spanish"];
    const isQuestFinished = (questId) => {
      if (questId === "spanish") {
        return ["1", "2", "3"].every((phaseId) =>
          localStorage.getItem(`historyrunnn.spanish.phase.${phaseId}`) === "finished"
        );
      }
      return localStorage.getItem(`historyrunnn.quest.${questId}`) === "finished";
    };

    const startButton = document.querySelector(".start-button");
    const questBoard = document.querySelector(".quest-board");
    const rewardButton = document.querySelector(".reward-button");
    const playerNameInput = document.querySelector("#player-name");
    const playerNameStorageKey = "historyrunnn.player.name";

    playerNameInput.value = localStorage.getItem(playerNameStorageKey) || "";
    playerNameInput.addEventListener("input", () => {
      const playerName = playerNameInput.value.trim();
      if (playerName) {
        localStorage.setItem(playerNameStorageKey, playerName);
      } else {
        localStorage.removeItem(playerNameStorageKey);
      }
    });

    document.querySelectorAll(".quest-note[data-quest]").forEach((note) => {
      if (isQuestFinished(note.dataset.quest)) {
        note.classList.add("is-finished");
        note.setAttribute("aria-label", `${note.querySelector(".quest-note-name").textContent} — Finished!`);
      }
    });

    const allQuestsFinished = questIds.every(isQuestFinished);
    rewardButton.disabled = !allQuestsFinished;
    if (allQuestsFinished) {
      document.querySelector(".reward-status").textContent = "All three quests are finished!";
    }

    rewardButton.addEventListener("click", () => {
      if (!questIds.every(isQuestFinished)) return;
      window.setTimeout(() => window.location.assign("reward.html"), 120);
    });

    startButton.addEventListener("click", (event) => {
      if (
        event.button !== 0 ||
        event.metaKey ||
        event.ctrlKey ||
        event.shiftKey ||
        event.altKey ||
        document.body.classList.contains("is-transitioning")
      ) {
        return;
      }

      event.preventDefault();
      const destination = startButton.href;

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.location.assign(destination);
        return;
      }

      questBoard.addEventListener("animationend", () => {
        window.location.assign(destination);
      }, { once: true });
      document.body.classList.add("is-transitioning");
    });
  </script>
  <script src="site-audio.js" defer></script>
</body>
</html>
